# پیکربندی Nginx برای پنل CRM امداد خودرو
# دامنه: panel.khodrochare.ir
#
# نصب:
#   cp deploy/nginx/panel.khodrochare.ir.conf /etc/nginx/sites-available/panel.khodrochare.ir
#   ln -s /etc/nginx/sites-available/panel.khodrochare.ir /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# پورت‌ها: وب روی 3100 (Next.js) و API روی 4100 (Express) — هر دو فقط روی loopback
# اگر پورت دیگری انتخاب کردید، همین‌جا اصلاح کنید.

upstream khodrochare_panel_web {
    server 127.0.0.1:3100;
    keepalive 32;
}

upstream khodrochare_panel_api {
    server 127.0.0.1:4100;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name panel.khodrochare.ir;

    client_max_body_size 10m;

    # ---------- API (Express) ----------
    location /api/ {
        proxy_pass         http://khodrochare_panel_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ---------- فایل‌های استاتیک Next.js ----------
    location /_next/static/ {
        proxy_pass         http://khodrochare_panel_web;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /fonts/ {
        proxy_pass         http://khodrochare_panel_web;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---------- پنل (Next.js) ----------
    location / {
        proxy_pass         http://khodrochare_panel_web;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
