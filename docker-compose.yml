services:
  db:
    image: postgres:16-alpine
    container_name: khodrochare-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-khodrochare_crm}
      POSTGRES_USER: ${DB_USER:-khodrochare}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-khodrochare}
      TZ: Asia/Tehran
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-khodrochare} -d ${DB_NAME:-khodrochare_crm}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - khodrochare

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: khodrochare-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${DB_USER:-khodrochare}:${DB_PASSWORD:-khodrochare}@db:5432/${DB_NAME:-khodrochare_crm}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET را در فایل .env تعریف کنید}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Tehran}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      AUTO_SEED: ${AUTO_SEED:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      MIGRATE_ON_START: 'true'
    ports:
      - '${API_PORT:-4000}:4000'
    networks:
      - khodrochare

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        API_PROXY_TARGET: http://api:4000
    container_name: khodrochare-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - '${WEB_PORT:-3000}:3000'
    networks:
      - khodrochare

volumes:
  pgdata:

networks:
  khodrochare:
    driver: bridge
